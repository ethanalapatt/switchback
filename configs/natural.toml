# Primary preset: the headline condition from SPEC.md section 9.3.
#
# The same 128 held-out prompts with EOS respected, so completions stop where the
# model wants to. Output lengths vary between engines, which means total latency
# alone is not a decode-rate comparison and must be read with tokens/sec and the
# length distribution. This is the cohort where draft startup cost on short
# completions can show up as a real loss.
#
schema_version = 1
name = "natural"
cohort = "natural_real"
description = "Natural stopping. EOS respected, so output length varies."

[models]
target = "Qwen/Qwen3-4B"
draft = "Qwen/Qwen3-0.6B"
dtype = "bfloat16"
device = "cuda"
attn_implementation = "sdpa"

[workload]
code_calibration = 64
code_heldout = 64
math_calibration = 64
math_heldout = 64
controlled_calibration = 0
controlled_heldout = 0
controlled_seed_calibration = 17
controlled_seed_heldout = 29

[condition]
name = "natural_stop_256"
mode = "greedy"
eos_policy = "respect"
max_new_tokens = 256
temperature = 1.0
seeds = [42]
repeats = 3

[run]
# adaptive_no_bypass is the ablation SPEC.md section 9.3 asks for. It belongs
# here rather than in the primary cohort: the controller never bypassed once in
# 384 primary requests, so the two engines were provably identical there.
# Natural stopping is where bypass could earn its place, because a request that
# ends after a handful of tokens never recovers the draft prefill.
engines = [
    "hf_ar", "native_ar", "fixed_1", "fixed_2", "fixed_4", "fixed_8",
    "hf_dynamic", "adaptive", "adaptive_no_bypass",
]
baseline = "hf_ar"
warmups = 2
scheduling_seed = 2026
# See docs/decisions/0005-renderer-near-tie-contract.md. Set above the BF16
# reduction-order noise measured in milestone 3 (up to 1.13 absolute) would let
# a real bug through; 0.5 is above every divergence observed (0.25) and well
# below a confident disagreement.
max_chosen_token_gap = 0.5
