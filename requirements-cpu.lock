# CPU-only environment for the offline correctness gate.
#
# This lock runs `pytest -m 'not gpu and not download'`, the property tests, the
# report-integrity tests, ruff, and mypy. It cannot satisfy a GPU gate: the
# integration tests marked `gpu` skip here, and a skip is not a pass.
#
# torch is intentionally left unpinned here because the right wheel depends on
# the platform. Install the CPU wheel for the
# target platform first, for example:
#
#   python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
#   python -m pip install -r requirements-cpu.lock
#
# The CUDA and aarch64-specific distributions from requirements-spark.lock are
# deliberately absent. Versions below match the Spark lock so the two
# environments differ only in the torch build. Verified by the GitHub Actions
# CPU job, not on the Spark.
